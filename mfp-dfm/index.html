<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>MFP runboard</title>
<link rel="stylesheet" href="vendor/pico.min.css">
<link rel="stylesheet" href="style.css">
<script src="app.js"></script>
<script defer src="vendor/alpine.min.js"></script>
</head>
<body x-data="runs" x-cloak>
<div id="gate" x-show="gate" x-cloak><form @submit.prevent="ok()"><h2>MFP runboard</h2><p class="muted">Enter the password to decrypt the data.</p>
  <input type="password" x-model="pw" placeholder="Password" autocomplete="current-password"><small x-text="err" class="stale"></small><button>Unlock</button></form></div>
<div class="wrap" x-show="D">
  <header class="top">
    <h1>MFP runboard</h1>
    <div class="meta">
      <div class="upd"><small>last updated</small><b :class="stale() && 'stale'" x-text="ago()" :title="updated()"></b></div>
      <button class="btn" @click="toggleTheme()" :title="'Theme: ' + themeLabel" x-text="'Theme: ' + themeLabel"></button>
    </div>
  </header>
  <div class="tabs">
    <template x-for="t in tabs" :key="t"><button :class="tab === t && 'on'" @click="setTab(t)"><span x-text="t"></span><span class="n" x-text="count(t)"></span></button></template>
    <a class="push" href="queues.html">GPU queues &rarr;</a>
  </div>
  <div class="count"><input type="search" class="small" x-model="q" placeholder="Search"><span x-text="rows.length"></span> runs<span x-show="tab === 'Scratch'"> &middot; smokes, probes, short or killed runs</span></div>
  <div style="overflow-x:auto"><table class="runs">
    <thead><tr><template x-for="c in cols" :key="c[0]"><th :class="[c[2], sort === c[0] && 'sorted']" @click="setSort(c[0])"><span x-text="c[1]"></span><span x-show="sort === c[0]" x-text="dir > 0 ? ' ▲' : ' ▼'"></span></th></template></tr>
    <tr class="filters"><template x-for="c in cols" :key="'f' + c[0]"><th :class="c[2]" @click.stop>
      <select x-show="f[c[0]] !== undefined" x-model="f[c[0]]" :aria-label="'Filter ' + c[1]"><option value="">All</option>
        <template x-for="v in (f[c[0]] !== undefined ? opts(c[0]) : [])" :key="v"><option :value="v" x-text="v"></option></template></select></th></template></tr></thead>
    <template x-for="r in rows" :key="r.id"><tbody class="run">
      <tr class="row" @click="flip(r)" :id="'run-' + r.id">
        <td><div class="title" :title="r.title"><span x-text="isOpen(r) ? '▾ ' : '▸ '"></span><span x-text="r.title"></span></div><div class="sub" :title="r.id" x-text="r.id"></div></td>
        <td class="hide-sm" x-text="r.stage"></td><td class="hide-sm" x-text="r.dataset"></td><td class="hide-sm" x-text="r.noise"></td>
        <td><span class="badge" :class="'s-' + r.status" x-text="r.status"></span></td>
        <td class="num"><template x-if="rmse(r)[0] != null"><span><span x-text="rmse(r)[0].toFixed(3)"></span><span class="tag" x-text="rmse(r)[1]"></span></span></template><span class="muted" x-show="rmse(r)[0] == null">-</span></td>
        <td class="hide-sm" :title="tip(r)" x-text="host(r)"></td>
        <td class="num" :title="abs(r.modified_at)" x-text="when(r) || 'not started'"></td>
      </tr>
      <tr class="det" x-show="isOpen(r)" x-cloak><td colspan="8" @click.stop>
        <div x-html="facts(r)"></div>
        <template x-for="a in r.attempts" :key="a.n"><div class="att">
          <h4><span>Attempt <span x-text="a.n"></span></span><span class="badge" :class="'s-' + a.status" x-text="a.status"></span>
            <span class="muted" x-text="a.host ? RB.hostName(a.host) : ''"></span><span class="muted" x-text="span(a)"></span>
            <a x-show="a.wandb_url" :href="a.wandb_url" target="_blank" rel="noopener" x-text="'W&B ' + a.wandb_id"></a>
            <span x-show="!a.wandb_url && a.wandb_id" class="mono" x-text="'W&B ' + a.wandb_id"></span></h4>
          <div x-html="attFacts(a)"></div></div></template>
        <p class="muted" x-show="!r.attempts.length">No attempts yet.</p>
      </td></tr>
    </tbody></template>
  </table></div>
  <p class="empty" x-show="!rows.length">No runs match.</p>
</div>
</body>
</html>
