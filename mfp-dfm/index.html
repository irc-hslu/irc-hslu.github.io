<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>MFP runboard</title>
<link rel="stylesheet" href="vendor/pico.min.css">
<link rel="stylesheet" href="vendor/tabulator-6.6.1.min.css">
<link rel="stylesheet" href="style.css?v=a50f4e47d6">
<script src="vendor/tabulator-6.6.1.min.js"></script>
<script src="vendor/lucide-1.59.0-icons.js"></script>
<script src="app.js?v=0bfb2946a1"></script>
<script defer src="vendor/alpine.min.js"></script>
</head>
<body x-data="runs" x-cloak>
<div id="gate" x-show="gate" x-cloak><form @submit.prevent="ok()"><h2>MFP runboard</h2><p class="muted">Enter the password to decrypt the data.</p>
  <input type="password" x-model="pw" placeholder="Password" autocomplete="current-password"><small x-text="err" class="stale"></small><button>Unlock</button></form></div>
<div class="wrap skel" x-show="!D && !gate" role="status" aria-label="Loading data">
  <div class="sk sk-top"></div><div class="sk sk-bar"></div>
  <div class="sk-row"><div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div></div>
  <div class="sk sk-line"></div><div class="sk sk-line"></div><div class="sk sk-line short"></div>
</div>
<div class="wrap" x-show="D">
  <header class="top">
    <div class="brand"><span class="logo"><span x-html="ic('gauge')"></span>MFP runboard</span>
      <nav class="nav" aria-label="Pages"><a href="index.html" :class="page === 'runs' && 'on'" :aria-current="page === 'runs' && 'page'"><span x-html="ic('list')"></span>Runs</a><a href="queues.html" :class="page === 'queues' && 'on'" :aria-current="page === 'queues' && 'page'"><span x-html="ic('server')"></span>GPU queues</a></nav></div>
    <div class="meta"><div class="upd"><small>last updated</small><b :class="stale() && 'stale'" x-text="ago()" :title="updated()"></b></div>
      <button type="button" class="rl" @click="reload()" :aria-busy="loading" :disabled="loading" title="Reload data" aria-label="Reload data"><span :class="loading && 'spin'" x-html="ic('refresh-cw')"></span></button>
      <button type="button" class="switch" role="switch" :aria-checked="dark" aria-label="Dark theme" :title="dark ? 'Switch to light theme' : 'Switch to dark theme'" @click="toggleTheme()">
        <span class="ic sun" x-html="ic('sun')"></span>
        <span class="ic moon" x-html="ic('moon')"></span><span class="thumb"></span></button></div>
  </header>
  <details class="howto" @toggle="$event.target.open && $nextTick(() => drawNames($refs.howsvg))">
    <summary><span x-html="ic('list')"></span>How to read run names</summary>
    <div class="howto-body">
      <svg class="howto-svg" x-ref="howsvg" role="img" aria-label="Run name anatomy: model, size, init, to, dataset, noise, tag"></svg>
      <dl class="howto-list"><template x-for="g in NAME_PARTS" :key="g.part"><div><dt><code x-text="g.part"></code> <b x-text="g.label"></b></dt><dd x-text="g.help"></dd></div></template></dl>
      <p class="muted small">Grammar: <code>&lt;model&gt;_&lt;size&gt;_&lt;init&gt;_to_&lt;dataset&gt;_&lt;noise&gt;[_&lt;tag&gt;…]</code>. A name never changes once given; a clash gets <code>_2</code>, <code>_3</code>, … in age order.</p>
    </div>
  </details>
  <div class="count"><input type="search" class="small" x-model="q" placeholder="Search"><span><b x-text="n"></b> runs</span>
    <label class="tgl"><input type="checkbox" role="switch" x-model="scratch"> include scratch <span class="muted">(smokes, probes, short or killed runs)</span></label></div>
  <div class="exh" :class="exh.on && 'on'">
    <label class="tgl"><input type="checkbox" role="switch" x-model="exh.on"> <b>Exhaustive order</b></label>
    <div class="exh-keys" role="list" aria-label="Sort keys, first varies slowest">
      <template x-for="(k, i) in exh.keys" :key="k.k"><div class="kchip" role="listitem" draggable="true" :class="[k.on && 'on', dragK === k.k && 'drag']"
          @dragstart="dragK = k.k" @dragend="dragK = null" @dragover.prevent @drop.prevent="dropKey(k.k)">
        <span class="grip" aria-hidden="true">&#8942;&#8942;</span><button type="button" class="kname" @click="k.on = !k.on" :aria-pressed="k.on" :title="k.on ? 'Click to leave this key out' : 'Click to use this key'" x-text="KEY_LABEL[k.k]"></button>
        <button type="button" class="kmv" @click="moveKey(i, -1)" :disabled="i === 0" :aria-label="'Move ' + KEY_LABEL[k.k] + ' left'">&lsaquo;</button><button type="button" class="kmv" @click="moveKey(i, 1)" :disabled="i === exh.keys.length - 1" :aria-label="'Move ' + KEY_LABEL[k.k] + ' right'">&rsaquo;</button>
      </div></template>
    </div>
    <label class="tgl" :class="!exh.on && 'dis'"><input type="checkbox" role="switch" x-model="exh.all" :disabled="!exh.on"> show all combinations</label>
    <span class="muted small exh-hint" x-show="exh.on" x-text="exhHint()"></span>
  </div>
  <div class="rb-mfilters"><template x-for="k in FILTER_KEYS" :key="'mf' + k">
    <select :aria-label="'Filter ' + KEY_LABEL[k]" :value="f[k]" @change="setFilter(k, $event.target.value)"><option value="" x-text="KEY_LABEL[k] + ': all'"></option>
      <template x-for="v in (D ? opts(k) : [])" :key="k + v"><option :value="v" :selected="f[k] === v" x-text="v.replace('_', ' ')"></option></template></select></template></div>
  <div id="runs-table" class="rb-table" x-ref="tbl"></div>
  <p class="empty" x-show="!n">No runs match.</p>
  <template id="det-tpl"><div class="rb-det" @click.stop>
        <div class="sumbox">
          <dl class="kv sum">
            <dt>W&amp;B name</dt><dd x-text="r.title"></dd>
            <dt>Stage</dt><dd x-text="r.stage"></dd>
            <dt>Pretraining</dt><dd x-text="r.pretrain || 'none'"></dd>
            <dt>SFT</dt><dd x-text="r.sft || 'none'"></dd>
            <dt>Model</dt><dd x-text="r.variant"></dd>
            <dt>Lineage</dt><dd><span class="lin" :class="'lin-' + r.lineage" x-text="r.lineage"></span><span x-show="r.parent_id" class="muted"> &middot; parent <span class="mono" x-text="r.parent_id"></span></span></dd>
          </dl>
          <div class="mgroups">
            <template x-for="g in [['best', r.metrics_best], ['last', r.metrics_last]]" :key="g[0]"><div class="mg">
              <div class="mg-h"><b x-text="g[0]"></b><span class="tag" x-text="g[1] ? g[1].src : ''"></span></div>
              <template x-for="m in metrics(g[1])" :key="m[0]"><div class="mrow"><span class="muted" x-text="m[0]"></span><span class="num" x-text="m[1]"></span></div></template></div></template>
          </div>
        </div>
        <div class="atts">
        <template x-for="a in attempts(r)" :key="a.n"><div class="att">
          <div class="att-h"><span class="muted">Attempt <span x-text="a.n"></span></span><span class="badge has-i" :class="'s-' + a.status" x-html="badgeHtml(a.status)"></span></div>
          <dl class="kv">
            <dt>W&amp;B</dt><dd><a class="lnk" x-show="a.wandb_url" :href="a.wandb_url" target="_blank" rel="noopener"><span x-html="ic('chart-line')"></span><span x-text="a.wandb_id"></span></a><span x-show="!a.wandb_url" x-text="a.wandb_id || '\u2014'"></span></dd>
            <dt>Started</dt><dd :title="abs(a.started_at)" x-text="a.started_at ? RB.relTime(a.started_at, now) : 'not started'"></dd>
            <dt>Duration</dt><dd x-text="dur(a)"></dd>
            <dt>Host</dt><dd :title="RB.hostTip(a.host)"><span class="lnk" x-show="a.host"><span x-html="ic('server')"></span><span x-text="RB.hostName(a.host)"></span></span><span x-show="!a.host">&mdash;</span></dd>
            <dt>Commit</dt><dd><a x-show="a.code_commit" :href="commitUrl(a.code_commit)" target="_blank" rel="noopener" class="mono lnk"><span x-html="ic('git-commit-horizontal')"></span><span x-text="sha(a.code_commit)"></span></a><span x-show="!a.code_commit">&mdash;</span></dd>
            <dt x-show="a.failure_reason">Reason</dt><dd x-show="a.failure_reason" x-text="a.failure_reason"></dd>
          </dl></div></template></div>
        <p class="muted" x-show="!r.attempts.length">No attempts yet.</p>
  </div></template>
</div>
</body>
</html>
