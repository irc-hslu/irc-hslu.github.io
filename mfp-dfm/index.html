<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MFP runboard</title>
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#1d2330; --muted:#6b7385; --line:#e3e1db; --accent:#2f5d8a; --chip:#eceae4;
  --ok:#2f7d4f; --ok-bg:#e1f1e7; --run:#2a6fb0; --run-bg:#dfeaf7; --wait:#9a6a12; --wait-bg:#f8ecd0;
  --plan:#5d6473; --plan-bg:#e8e8ea; --bad:#b03a3a; --bad-bg:#f8dfdf; --nest:#2d6a6a; --nest-bg:#d9eeee;
  --par:#7a4d8f; --par-bg:#eddff4; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#14171d; --panel:#1c2029; --ink:#e4e7ee; --muted:#8e97aa; --line:#2b303c; --accent:#7fb0e0; --chip:#262b36;
  --ok:#6fcf97; --ok-bg:#1d3a2b; --run:#78b4ee; --run-bg:#1b3350; --wait:#e8b857; --wait-bg:#3b3015;
  --plan:#a0a7b8; --plan-bg:#2a2e38; --bad:#ee8c8c; --bad-bg:#431f1f; --nest:#7fd0d0; --nest-bg:#183838;
  --par:#d3a6e8; --par-bg:#35203f;}}
*{box-sizing:border-box}
html{font-size:15px}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px 48px}
header{padding:20px 0 8px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-size:1.5rem;letter-spacing:-.01em}
.upd{text-align:right}
.upd b{font-size:1.15rem}
.upd small{color:var(--muted);display:block}
.stale{color:var(--bad)}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:8px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:inherit;padding:10px 14px;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--accent);font-weight:600}
nav .n{font-size:.8rem;background:var(--chip);border-radius:9px;padding:1px 7px;margin-left:6px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:16px 0 8px}
input[type=search]{flex:1 1 280px;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .lab{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:2px 10px;font:inherit;font-size:.85rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.count{color:var(--muted);font-size:.9rem;margin:4px 0 8px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap;background:var(--panel)}
th[aria-sort]{color:var(--ink)}
th[aria-sort=ascending]::after{content:" \25B2";font-size:.7em}
th[aria-sort=descending]::after{content:" \25BC";font-size:.7em}
tr.run{cursor:pointer}
tr.run:hover td{background:color-mix(in srgb,var(--accent) 6%,var(--panel))}
tr.detail td{background:color-mix(in srgb,var(--chip) 45%,var(--panel));padding:14px 18px}
.title{font-weight:600}
.sub{color:var(--muted);font-size:.82rem;font-family:var(--mono)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:1px 9px;font-size:.82rem;font-weight:600;white-space:nowrap}
.s-succeeded{color:var(--ok);background:var(--ok-bg)} .s-running{color:var(--run);background:var(--run-bg)}
.s-queued{color:var(--wait);background:var(--wait-bg)} .s-planned,.s-smoke{color:var(--plan);background:var(--plan-bg)}
.s-failed{color:var(--bad);background:var(--bad-bg)}
.s-superseded,.s-cancelled{color:var(--muted);background:transparent;border:1px solid var(--line);text-decoration:line-through}
.s-running::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){.s-running::before{animation:none}}
.lin{border-radius:6px;padding:1px 8px;font-size:.8rem;background:var(--chip);color:var(--muted)}
.lin-nested{background:var(--nest-bg);color:var(--nest)} .lin-parallel{background:var(--par-bg);color:var(--par)}
.metric{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px;font-size:.88rem;margin:6px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--mono);font-size:.82rem}
.att{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px 14px;margin:10px 0}
.att h4{margin:0 0 4px;font-size:.95rem;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.cp{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:5px;font-size:.72rem;padding:0 6px;margin-left:6px;cursor:pointer}
a{color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;margin-top:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{margin:0;font-size:1.1rem;display:flex;justify-content:space-between;gap:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--ok)} .dot.off{background:var(--bad)}
.card h5{margin:14px 0 4px;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.job{padding:6px 0;border-top:1px solid var(--line);font-size:.9rem}
.job:first-of-type{border-top:0}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--run)}
.empty{text-align:center;color:var(--muted);padding:32px}
#gate{max-width:360px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px}
#gate input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:var(--ink)}
#gate button{margin-top:12px;padding:8px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;cursor:pointer}
#err{color:var(--bad);min-height:1.4em;margin:8px 0 0}
.hide-sm{}
@media (max-width:820px){.hide-sm{display:none}}
</style>
</head>
<body>
<div id="gate" hidden>
  <h2 style="margin-top:0">MFP runboard</h2>
  <p class="muted">Enter the password to decrypt the data.</p>
  <form id="gf"><input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus><button>Unlock</button></form>
  <div id="err" role="alert"></div>
</div>
<div class="wrap" id="app" hidden>
  <header>
    <h1>MFP runboard</h1>
    <div class="upd"><small>last updated</small><b id="upd"></b><small id="ago"></small></div>
  </header>
  <nav id="tabs" role="tablist"></nav>
  <main id="main"></main>
</div>
<script>
"use strict";
const TABS = ["PromptDA", "Ours_SV", "Ours_MV", "Other", "GPU queues"];
const FILTERS = [["status", "status"], ["stage", "stage"], ["dataset", "dataset"], ["noise", "noise"], ["lineage", "lineage"]];
const COLS = [["title", "Run"], ["stage", "Stage", "hide-sm"], ["dataset", "Dataset · noise"], ["lineage", "Lineage", "hide-sm"], ["status", "Status"],
              ["metric", "Best metric"], ["host", "Host", "hide-sm"], ["submitted_at", "Submitted"]];
const STATUS_ORDER = ["running", "queued", "planned", "failed", "succeeded", "cancelled", "superseded"];
let DATA = null, tab = TABS.includes(decodeURIComponent(location.hash.slice(1))) ? decodeURIComponent(location.hash.slice(1)) : "PromptDA";
const st = {}; // per-tab UI state
const newState = () => ({q: "", f: {}, sort: "submitted_at", dir: -1, open: new Set(new URLSearchParams(location.search).getAll("open"))});
const $ = (s) => document.querySelector(s);

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, ""); else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
const fmt = (x, d = 3) => (typeof x === "number" ? x.toFixed(d) : x);
function ago(iso) {
  if (!iso) return "";
  const m = (Date.now() - new Date(iso)) / 60000;
  if (m < 1) return "just now"; if (m < 90) return Math.round(m) + " min ago";
  if (m < 2880) return Math.round(m / 60) + " h ago"; return Math.round(m / 1440) + " d ago";
}
const when = (iso) => iso ? new Date(iso).toLocaleString([], {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"}) : "-";
function copy(text, btn) { navigator.clipboard?.writeText(text).then(() => { btn.textContent = "copied"; setTimeout(() => btn.textContent = "copy", 1200); }); }
function mono(v) { // monospaced value with copy button
  const s = typeof v === "string" ? v : JSON.stringify(v, null, 1);
  const b = h("button", {class: "cp", type: "button", onclick: (e) => { e.stopPropagation(); copy(s, b); }}, "copy");
  return h("span", {}, h("span", {class: "mono", style: "white-space:pre-wrap"}, s), b);
}
const badge = (s) => h("span", {class: "badge s-" + s}, s);
const lin = (l) => h("span", {class: "lin lin-" + l}, l || "n.a.");
const hostOf = (r) => { const a = [...(r.attempts || [])].reverse().find((x) => x.host); return a ? a.host : ""; };
const metricOf = (r) => { const m = r.summary_metrics || {}; return m.test_rmse ?? m.dev_best_rmse ?? null; };
const val = (r, k) => k === "metric" ? metricOf(r) : k === "host" ? hostOf(r) : r[k];

// ---------------------------------------------------------------- data loading
async function decrypt(blob, pw) {
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(blob.salt), iterations: blob.iter, hash: "SHA-256"}, base,
    {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(blob.iv)}, key, b64(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function load() {
  if (window.RUNBOARD_DATA) return window.RUNBOARD_DATA;
  if (new URLSearchParams(location.search).has("local")) return (await fetch("../../specs/runboard/runs.json")).json();
  const blob = await (await fetch("./runs.enc.json", {cache: "no-store"})).json();
  const tryPw = async (pw) => { const d = await decrypt(blob, pw); try { sessionStorage.setItem("runboard_pw", pw); } catch (e) {} return d; };
  let saved = null; try { saved = sessionStorage.getItem("runboard_pw"); } catch (e) {}
  if (saved) { try { return await tryPw(saved); } catch (e) {} }
  $("#gate").hidden = false;
  return new Promise((res) => $("#gf").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    try { const d = await tryPw($("#pw").value); $("#gate").hidden = true; res(d); }
    catch (e) { $("#err").textContent = "Wrong password."; }
  }));
}

// ---------------------------------------------------------------- views
function renderHead() {
  $("#upd").textContent = new Date(DATA.last_updated).toLocaleString([], {dateStyle: "medium", timeStyle: "short"});
  const m = (Date.now() - new Date(DATA.last_updated)) / 60000;
  $("#ago").textContent = ago(DATA.last_updated); $("#ago").className = m > 180 ? "stale" : "";
  const nav = $("#tabs"); nav.replaceChildren(...TABS.map((t) => {
    const n = t === "GPU queues" ? Object.keys(DATA.queues || {}).length : DATA.runs.filter((r) => r.tab === t).length;
    return h("button", {role: "tab", "aria-selected": t === tab, onclick: () => { tab = t; location.hash = t; render(); }}, t, h("span", {class: "n"}, n));
  }));
}
function render() { renderHead(); const m = $("#main"); m.replaceChildren(tab === "GPU queues" ? queues() : runsView()); }

function runsView() {
  const S = st[tab] ??= newState();
  const all = DATA.runs.filter((r) => r.tab === tab);
  const box = h("div");
  const list = h("div");
  const hay = (r) => r._s ??= JSON.stringify(r).toLowerCase();
  const draw = () => {
    const rows = all.filter((r) => (!S.q || S.q.toLowerCase().split(/\s+/).every((w) => hay(r).includes(w))) &&
      FILTERS.every(([k]) => !S.f[k]?.size || S.f[k].has(String(r[k]))));
    const cmp = (a, b) => {
      let x = val(a, S.sort), y = val(b, S.sort);
      if (S.sort === "status") { x = STATUS_ORDER.indexOf(x); y = STATUS_ORDER.indexOf(y); }
      if (x == null || x === "" ) return S.sort === "submitted_at" ? -S.dir : 1; // unknown dates (planned) first when newest-first
      if (y == null || y === "") return S.sort === "submitted_at" ? S.dir : -1;
      return (x < y ? -1 : x > y ? 1 : 0) * S.dir;
    };
    rows.sort(cmp);
    list.replaceChildren(h("div", {class: "count"}, `${rows.length} of ${all.length} runs`),
      rows.length ? table(rows, S, draw) : h("div", {class: "empty"}, "No runs match."));
  };
  const chips = h("div", {class: "tools"}, ...FILTERS.map(([k, label]) => {
    const vals = [...new Set(all.map((r) => String(r[k])))].sort((a, b) => k === "status" ? STATUS_ORDER.indexOf(a) - STATUS_ORDER.indexOf(b) : a.localeCompare(b));
    return h("div", {class: "chips"}, h("span", {class: "lab"}, label), ...vals.map((v) => {
      const b = h("button", {class: "chip", type: "button", "aria-pressed": !!S.f[k]?.has(v), onclick: () => {
        const set = S.f[k] ??= new Set(); set.has(v) ? set.delete(v) : set.add(v);
        b.setAttribute("aria-pressed", set.has(v)); draw(); }}, v); return b; }));
  }));
  const search = h("input", {type: "search", placeholder: "Search every field, including attempts (id, W&B name, sha, path, note...)", value: S.q,
    oninput: (e) => { S.q = e.target.value; draw(); }});
  box.append(h("div", {class: "tools"}, search), chips, list); draw(); return box;
}

function table(rows, S, redraw) {
  const head = h("tr", {}, ...COLS.map(([k, label, cls]) => h("th", {class: cls || "", "aria-sort": S.sort === k ? (S.dir > 0 ? "ascending" : "descending") : null,
    onclick: () => { S.dir = S.sort === k ? -S.dir : (k === "title" || k === "dataset" ? 1 : -1); S.sort = k; redraw(); }}, label)));
  const body = [];
  for (const r of rows) {
    const open = S.open.has(r.id);
    body.push(h("tr", {class: "run", id: "run-" + r.id, onclick: () => { open ? S.open.delete(r.id) : S.open.add(r.id); redraw(); }},
      h("td", {}, h("div", {class: "title"}, (open ? "▾ " : "▸ ") + r.title), h("div", {class: "sub"}, r.id)),
      h("td", {class: "hide-sm", style: "font-size:.88rem"}, r.stage), h("td", {}, [r.dataset, r.noise].filter((x) => x && x !== "-").join(" · ") || "-"), h("td", {class: "hide-sm"}, lin(r.lineage)),
      h("td", {}, badge(r.status)),
      h("td", {class: "metric"}, metricCell(r)), h("td", {class: "hide-sm"}, hostOf(r) || "-"),
      h("td", {style: "white-space:nowrap", title: r.submitted_at || ""}, r.submitted_at ? [when(r.submitted_at), h("div", {class: "sub"}, ago(r.submitted_at))] : h("span", {class: "muted"}, "not started"))));
    if (open) body.push(h("tr", {class: "detail"}, h("td", {colspan: COLS.length}, detail(r))));
  }
  return h("table", {}, h("thead", {}, head), h("tbody", {}, body));
}
function metricCell(r) {
  const m = r.summary_metrics || {};
  if (m.test_rmse != null) return [`test ${fmt(m.test_rmse)}`, h("div", {class: "sub"}, `dev ${fmt(m.dev_best_rmse)}`)];
  return m.dev_best_rmse != null ? `dev ${fmt(m.dev_best_rmse)}` : h("span", {class: "muted"}, "-");
}
function jump(id) { const r = DATA.runs.find((x) => x.id === id); if (!r) return; tab = r.tab; (st[tab] ??= newState()).open.add(id);
  location.hash = tab; render(); document.getElementById("run-" + id)?.scrollIntoView({block: "center"}); }
const runLink = (id) => DATA.runs.some((x) => x.id === id) ? h("a", {href: "#", onclick: (e) => { e.preventDefault(); e.stopPropagation(); jump(id); }}, id) : id;

function kv(pairs) {
  return h("dl", {class: "kv"}, ...pairs.filter(([, v]) => v != null && v !== "" && !(typeof v === "object" && !Object.keys(v).length)).flatMap(([k, v]) => [h("dt", {}, k), h("dd", {}, v.nodeType ? v : mono(v))]));
}
function detail(r) {
  const m = r.summary_metrics || {};
  const top = kv([["id", r.id], ["parent", r.parent_id ? runLink(r.parent_id) : null], ["source", r.source], ["notes", r.notes && String(r.notes)],
    ["metrics", Object.fromEntries(Object.entries(m).filter(([, v]) => v != null))], ["registry", r.registry]]);
  const atts = (r.attempts || []).map((a) => {
    const dur = a.started_at && a.ended_at ? Math.round((new Date(a.ended_at) - new Date(a.started_at)) / 60000) + " min" : null;
    const kids = ["notes", "metrics", "warm_start_parent"].map((k) => a[k]);
    return h("div", {class: "att"},
      h("h4", {}, `Attempt ${a.n}`, badge(a.status), a.smoke_outcome ? h("span", {class: "muted"}, "smoke " + a.smoke_outcome) : null,
        h("span", {class: "muted"}, [a.host, a.gpu].filter(Boolean).join(" · ")),
        h("span", {class: "muted"}, `${when(a.started_at)}${a.ended_at ? " → " + when(a.ended_at) : ""}${dur ? " (" + dur + ")" : ""}`),
        a.wandb_url ? h("a", {href: a.wandb_url, target: "_blank", rel: "noopener", onclick: (e) => e.stopPropagation()}, "W&B " + a.wandb_id) : (a.wandb_id ? h("span", {class: "mono"}, "W&B " + a.wandb_id) : null)),
      kv([["wandb_name", a.wandb_name], ["code_commit", a.code_commit], ["worktree", a.worktree], ["job_file", a.job_file], ["output_dir", a.output_dir],
        ["checkpoint", a.checkpoint], ["checkpoint_sha256", a.checkpoint_sha256], ["eval_files", a.eval_files], ["failure_reason", a.failure_reason],
        ["raw_status", a.raw_status], ["metrics", a.metrics], ["warm_start_parent", a.warm_start_parent], ["notes", a.notes]]));
  });
  return h("div", {onclick: (e) => e.stopPropagation()}, top, atts.length ? atts : h("div", {class: "muted"}, "No attempts yet."));
}

function jobRow(j, kind) {
  return h("div", {class: "job"},
    h("div", {}, h("b", {}, j.name.replace(/\.job$/, "")), " ",
      j.run_id ? runLink(j.run_id) : h("span", {class: "badge s-planned", title: (j.candidates || []).join(", ")}, "unmapped"),
      kind === "failed" && j.exit ? h("span", {class: "badge s-failed", style: "margin-left:6px"}, "exit " + j.exit) : null),
    j.desc ? h("div", {class: "muted", style: "font-size:.85rem"}, j.desc) : null,
    h("div", {class: "sub"}, [j.started ? "started " + when(j.started) : null, j.finished ? "finished " + when(j.finished) : null].filter(Boolean).join(" · ")),
    j.progress ? [h("div", {class: "sub"}, j.progress), h("div", {class: "bar"}, h("i", {style: `width:${parseInt(j.progress.match(/\((\d+)%/)?.[1] || 0)}%`}))] : null);
}
function queues() {
  const cards = Object.entries(DATA.queues || {}).map(([host, q]) => {
    const sec = (label, jobs, kind) => jobs?.length ? [h("h5", {}, `${label} (${jobs.length})`), ...jobs.map((j) => jobRow(j, kind))] : [h("h5", {}, label), h("div", {class: "muted"}, "none")];
    return h("div", {class: "card"},
      h("h3", {}, h("span", {}, h("span", {class: "dot" + (q.reachable ? "" : " off")}), host), h("span", {class: "muted", style: "font-weight:400;font-size:.9rem"}, q.gpu)),
      h("div", {class: "sub"}, q.reachable ? `${q.gpu_status || "GPU status n/a"} · checked ${ago(q.checked_at)}` : q.note || "unreachable"),
      sec("Running", q.running, "run"), sec("Queued (in order)", q.queued, "q"), q.paused?.length ? sec("Paused", q.paused, "p") : null,
      sec("Recent failures", q.failed_recent, "failed"), sec("Recently done", (q.done_recent || []).slice(0, 4), "done"));
  });
  return h("div", {class: "cards"}, cards);
}

load().then((d) => { DATA = d; $("#app").hidden = false; render(); setInterval(renderHead, 60000); })
  .catch((e) => { document.body.append(h("p", {class: "empty"}, "Could not load data: " + e.message)); });
</script>
</body>
</html>
